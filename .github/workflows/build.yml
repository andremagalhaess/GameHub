name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes do núcleo
        run: dotnet test tests/GameHub.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Compilar o aplicativo (WinUI 3, x64)
        run: dotnet build src/GameHub.App/GameHub.App.csproj -c Release -p:Platform=x64

      - name: Publicar pasta portátil
        run: dotnet publish src/GameHub.App/GameHub.App.csproj -c Release -p:Platform=x64 -r win-x64 -o publish/GameHub-win-x64

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\GameHub.iss /DAppVersion=1.0.0 /DSourceDir=..\publish\GameHub-win-x64
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o instalador." }

      - uses: actions/upload-artifact@v4
        with:
          name: GameHub-win-x64
          path: publish/GameHub-win-x64
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: GameHub-Setup-x64
          path: publish/GameHub-Setup-*.exe
          retention-days: 30
